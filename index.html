<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RISC · Amigo Secreto 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --verde:#0e3b2c; --verde2:#14513c; --creme:#fbf6ea; --ouro:#d9b25f;
    --vermelho:#c2412d; --texto:#1d2a24; --suave:#6b7a72;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--creme);
    background:
      radial-gradient(1200px 600px at 50% -10%, #1d6b4f 0%, transparent 60%),
      radial-gradient(800px 500px at 100% 110%, #3a1a14 0%, transparent 55%),
      var(--verde);
    min-height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 20px;overflow-x:hidden;
  }
  .neve{position:fixed;inset:0;pointer-events:none;z-index:0}
  .neve i{position:absolute;top:-10px;width:6px;height:6px;border-radius:50%;
    background:rgba(255,255,255,.55);animation:cai linear infinite}
  @keyframes cai{to{transform:translateY(110vh) translateX(30px)}}

  header{position:relative;z-index:1;text-align:center;margin-bottom:28px}
  .marca{letter-spacing:.32em;font-weight:700;font-size:clamp(26px,6vw,34px);color:var(--ouro);padding-left:.32em}
  h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:clamp(38px,9vw,64px);
    line-height:1;margin:10px 0 6px}
  .ano{font-family:Fraunces,Georgia,serif;font-size:20px;color:rgba(251,246,234,.7)}

  .cartao{position:relative;z-index:1;width:100%;max-width:420px;background:var(--creme);
    color:var(--texto);border-radius:20px;padding:30px 26px 26px;
    box-shadow:0 30px 60px rgba(0,0,0,.35);text-align:center}
  .cartao::before{content:"";position:absolute;left:50%;top:-14px;transform:translateX(-50%);
    width:56px;height:28px;border-radius:14px 14px 4px 4px;background:var(--vermelho)}
  .cartao p{margin:0 0 18px;color:var(--suave);line-height:1.5}
  label{display:block;font-size:13px;font-weight:600;text-align:left;margin-bottom:6px;color:var(--texto)}
  input{width:100%;font:600 22px/1 Inter,monospace;letter-spacing:.18em;text-align:center;
    text-transform:uppercase;padding:14px 12px;border:2px solid #e3dccb;border-radius:12px;
    background:#fff;color:var(--texto);outline:none}
  input:focus{border-color:var(--verde2)}
  button{margin-top:14px;width:100%;font:600 16px Inter,sans-serif;padding:14px;border:0;
    border-radius:12px;background:var(--verde2);color:var(--creme);cursor:pointer}
  button:hover{background:var(--verde)}
  button:disabled{opacity:.6;cursor:wait}
  .erro{min-height:20px;margin-top:12px;font-size:14px;color:var(--vermelho)}

  .ola{font-family:Fraunces,Georgia,serif;font-size:30px;color:var(--texto);margin:0 0 6px}
  .presente{font-size:58px;line-height:1;margin:8px 0 14px;cursor:pointer;user-select:none;
    display:inline-block;animation:balanca 1.8s ease-in-out infinite}
  @keyframes balanca{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
  .rotulo{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--suave);margin-top:6px}
  .nome{font-family:Fraunces,Georgia,serif;font-weight:700;color:var(--vermelho);
    font-size:clamp(40px,12vw,56px);margin:6px 0 8px;opacity:0;transform:scale(.7);
    transition:all .5s cubic-bezier(.2,1.4,.4,1)}
  .nome.ver{opacity:1;transform:scale(1)}
  .dica{font-size:13px;color:var(--suave);margin-top:14px}
  .oculto{display:none}
  .link{background:none;color:var(--suave);font-weight:500;font-size:14px;margin-top:10px;padding:6px}
  .link:hover{background:none;color:var(--texto)}
  footer{position:relative;z-index:1;margin-top:26px;font-size:12px;color:rgba(251,246,234,.5)}
</style>
</head>
<body>
<div class="neve" id="neve"></div>

<header>
  <div class="marca">RISC</div>
  <h1>Amigo Secreto</h1>
  <div class="ano">2026</div>
</header>

<main class="cartao">
  <section id="t1">
    <p>Digite a chave que você recebeu para descobrir quem você tirou.</p>
    <form id="f" autocomplete="off">
      <label for="k">Sua chave</label>
      <input id="k" maxlength="11" placeholder="XXXX-XXXX" spellcheck="false" autocapitalize="characters">
      <button id="b" type="submit">Descobrir</button>
      <div class="erro" id="e"></div>
    </form>
  </section>

  <section id="t2" class="oculto">
    <div class="ola">Olá, <span id="q"></span>!</div>
    <p>Confira se ninguém está olhando e toque no presente.</p>
    <div class="presente" id="g" role="button" aria-label="Revelar">🎁</div>
    <div class="rotulo">Seu amigo secreto é</div>
    <div class="nome" id="r">?</div>
    <div class="dica" id="d">Guarde segredo até o dia da troca 🤫</div>
    <button class="link" id="v" type="button">Sair</button>
  </section>
</main>

<footer>Cada chave abre um único resultado. Não compartilhe a sua.</footer>
